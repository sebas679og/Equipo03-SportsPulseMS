# Application Configuration for Sports Pulse Leagues Service
spring.application.name=sports-pulse-leagues
server.port=8082
logging.level.org.springframework=WARN
logging.level.root=WARN
logging.level.com.sportspulse=DEBUG
management.endpoints.web.exposure.include=health

# Documentation Configuration (Swagger/OpenAPI)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.version=OPENAPI_3_1

# API-Football configuration for ms-leagues
sportspulse.leagues.api.football.base-url=http://localhost:8080/api/football
sportspulse.leagues.api.football.api-key=test-api-key

# Authentication service configuration for ms-leagues
sportspulse.leagues.services.auth.base-url=localhost:8080/api/auth
sportspulse.leagues.services.auth.api-key=internal-api-key

# Cache configuration
sportspulse.leagues.cache.enabled=false
sportspulse.leagues.cache.ttl-minutes=60
sportspulse.leagues.cache.max-size=1000