# Application Configuration for Sports Pulse Standings Service
spring.application.name=sports-pulse-standings
server.port=8086
logging.level.org.springframework=WARN
logging.level.root=WARN
logging.level.com.sportspulse=DEBUG
management.endpoints.web.exposure.include=health

# Documentation Configuration (Swagger/OpenAPI)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.version=OPENAPI_3_1

# ApiFootball API Configuration
sportspulse.standings.api.football.base-url=http://localhost:8080/api/football
sportspulse.standings.api.football.api-key=test-api-key

# Auth Service Configuration
sportspulse.standings.services.auth.base-url=localhost:8080/api/auth
sportspulse.standings.services.auth.api-key=test-internal-api-key

# Cache Configuration for Standings
sportspulse.standings.cache.enabled=false
sportspulse.standings.cache.ttl-minutes=1440
sportspulse.standings.cache.max-size=1000