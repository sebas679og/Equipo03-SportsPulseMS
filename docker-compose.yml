name: Sports-Pulse-API

services:
  postgres-datasource:
    image: postgres:18.3
    environment:
      POSTGRES_USER: ${SPORTS_PULSE_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${SPORTS_PULSE_DATASOURCE_PASSWORD}
      SPORTS_PULSE_DATASOURCE_DB_AUTH: ${SPORTS_PULSE_DATASOURCE_DB_AUTH}
      SPORTS_PULSE_DATASOURCE_DB_NOTIFICATIONS: ${SPORTS_PULSE_DATASOURCE_DB_NOTIFICATIONS}
    ports:
      - "5432:5432"
    volumes:
      - ./sports-pulse-data:/var/lib/postgresql
      - ./config/postgres_db/init-multiple-db.sh:/docker-entrypoint-initdb.d/init-multiple-db.sh
    restart: always
    networks:
      - sports-pulse-network

  redis:
    image: redis:8.6.2-alpine
    ports:
      - "6379:6379"
    restart: always
    networks:
      - sports-pulse-network

  ms-gateway:
    build:
      context: ./ms-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SWAGGER_UI_DOCUMENTATION_ENABLED: ${SWAGGER_UI_DOCUMENTATION_ENABLED}
      SPORTS_PULSE_REDIS_HOST: redis
      SPORTS_PULSE_REDIS_PORT: 6379
      SPORTS_PULSE_GATEWAY_CONNECT_TIMEOUT: ${SPORTS_PULSE_GATEWAY_CONNECT_TIMEOUT}
      SPORTS_PULSE_GATEWAY_RESPONSE_TIMEOUT: ${SPORTS_PULSE_GATEWAY_RESPONSE_TIMEOUT}
      SPORTS_PULSE_GATEWAY_ALLOWED_METHODS: ${SPORTS_PULSE_GATEWAY_ALLOWED_METHODS}
      SPORTS_PULSE_GATEWAY_ALLOWED_ORIGINS: ${SPORTS_PULSE_GATEWAY_ALLOWED_ORIGINS}
      SPORTS_PULSE_GATEWAY_MAX_AGE: ${SPORTS_PULSE_GATEWAY_MAX_AGE}
      SPORTS_PULSE_AUTH_SERVICE_URL: http://ms-auth:8081
      SPORTS_PULSE_LEAGUES_SERVICE_URL: http://ms-leagues:8082
      SPORTS_PULSE_TEAMS_SERVICE_URL: http://ms-teams:8083
      SPORTS_PULSE_FIXTURES_SERVICE_URL: http://ms-fixtures:8085
      SPORTS_PULSE_STANDINGS_SERVICE_URL: http://ms-standings:8086
      SPORTS_PULSE_NOTIFICATIONS_SERVICE_URL: http://ms-notifications:8088
      SPORTS_PULSE_DASHBOARD_SERVICE_URL: http://ms-dashboard:8089
    restart: on-failure
    networks:
      - sports-pulse-network

  ms-auth:
    build:
      context: ./ms-auth
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - postgres-datasource
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPORTS_PULSE_DATASOURCE_URL_AUTH: jdbc:postgresql://postgres-datasource:5432/${SPORTS_PULSE_DATASOURCE_DB_AUTH}
      SPORTS_PULSE_DATASOURCE_USERNAME: ${SPORTS_PULSE_DATASOURCE_USERNAME}
      SPORTS_PULSE_DATASOURCE_PASSWORD: ${SPORTS_PULSE_DATASOURCE_PASSWORD}
      SPORTS_PULSE_JPA_DDL: ${SPORTS_PULSE_JPA_DDL}
      SPORTS_PULSE_JWT_SECRET: ${SPORTS_PULSE_JWT_SECRET}
      SPORTS_PULSE_JWT_EXPIRATION: ${SPORTS_PULSE_JWT_EXPIRATION}
      SPORTS_PULSE_TOKEN_TYPE: ${SPORTS_PULSE_TOKEN_TYPE}
      SPORTS_PULSE_INTERNAL_API_KEY: ${SPORTS_PULSE_INTERNAL_API_KEY}
      SWAGGER_UI_DOCUMENTATION_ENABLED: ${SWAGGER_UI_DOCUMENTATION_ENABLED}
    restart: on-failure
    networks:
      - sports-pulse-network

  ms-leagues:
    build:
      context: ./ms-leagues
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SWAGGER_UI_DOCUMENTATION_ENABLED: ${SWAGGER_UI_DOCUMENTATION_ENABLED}
      SPORTS_PULSE_API_FOOTBALL_BASE_URL: ${SPORTS_PULSE_API_FOOTBALL_BASE_URL}
      SPORTS_PULSE_API_FOOTBALL_KEY: ${SPORTS_PULSE_API_FOOTBALL_KEY}
      SPORTS_PULSE_AUTH_SERVICE_URL: http://ms-auth:8081
      SPORTS_PULSE_INTERNAL_API_KEY: ${SPORTS_PULSE_INTERNAL_API_KEY}
      SPORTS_PULSE_CACHE_LEAGUES_ENABLED: ${SPORTS_PULSE_CACHE_LEAGUES_ENABLED}
      SPORTS_PULSE_CACHE_LEAGUES_TTL_MINUTES: ${SPORTS_PULSE_CACHE_LEAGUES_TTL_MINUTES}
      SPORTS_PULSE_CACHE_LEAGUES_MAX_SIZE: ${SPORTS_PULSE_CACHE_LEAGUES_MAX_SIZE}
    restart: on-failure
    networks:
      - sports-pulse-network

  ms-teams:
    build:
      context: ./ms-teams
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SWAGGER_UI_DOCUMENTATION_ENABLED: ${SWAGGER_UI_DOCUMENTATION_ENABLED}
      SPORTS_PULSE_LEAGUES_SERVICE_URL: http://ms-auth:8081
      SPORTS_PULSE_INTERNAL_API_KEY: ${SPORTS_PULSE_INTERNAL_API_KEY}
      SPORTS_PULSE_CACHE_TEAMS_ENABLED: ${SPORTS_PULSE_CACHE_TEAMS_ENABLED}
      SPORTS_PULSE_CACHE_TEAMS_TTL_MINUTES: ${SPORTS_PULSE_CACHE_TEAMS_TTL_MINUTES}
      SPORTS_PULSE_CACHE_TEAMS_MAX_SIZE: ${SPORTS_PULSE_CACHE_TEAMS_MAX_SIZE}
      SPORTS_PULSE_API_FOOTBALL_BASE_URL: ${SPORTS_PULSE_API_FOOTBALL_BASE_URL}
      SPORTS_PULSE_API_FOOTBALL_KEY: ${SPORTS_PULSE_API_FOOTBALL_KEY}
    restart: on-failure
    networks:
      - sports-pulse-network

  ms-fixtures:
    build:
      context: ./ms-fixtures
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SWAGGER_UI_DOCUMENTATION_ENABLED: ${SWAGGER_UI_DOCUMENTATION_ENABLED}
      SPORTS_PULSE_API_FOOTBALL_BASE_URL: ${SPORTS_PULSE_API_FOOTBALL_BASE_URL}
      SPORTS_PULSE_API_FOOTBALL_KEY: ${SPORTS_PULSE_API_FOOTBALL_KEY}
    restart: on-failure
    networks:
      - sports-pulse-network

  ms-standings:
    build:
      context: ./ms-standings
      dockerfile: Dockerfile
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPORTS_PULSE_AUTH_SERVICE_URL: http://ms-auth:8081
      SPORTS_PULSE_INTERNAL_API_KEY: ${SPORTS_PULSE_INTERNAL_API_KEY}
      SWAGGER_UI_DOCUMENTATION_ENABLED: ${SWAGGER_UI_DOCUMENTATION_ENABLED}
      SPORTS_PULSE_API_FOOTBALL_BASE_URL: ${SPORTS_PULSE_API_FOOTBALL_BASE_URL}
      SPORTS_PULSE_API_FOOTBALL_KEY: ${SPORTS_PULSE_API_FOOTBALL_KEY}
      SPORTS_PULSE_CACHE_STANDINGS_ENABLED: ${SPORTS_PULSE_CACHE_STANDINGS_ENABLED}
      SPORTS_PULSE_CACHE_STANDINGS_TTL_MINUTES: ${SPORTS_PULSE_CACHE_STANDINGS_TTL_MINUTES}
      SPORTS_PULSE_CACHE_STANDINGS_MAX_SIZE: ${SPORTS_PULSE_CACHE_STANDINGS_MAX_SIZE}
    restart: on-failure
    networks:
      - sports-pulse-network

  ms-notifications:
    build:
      context: ./ms-notifications
      dockerfile: Dockerfile
    ports:
      - "8088:8088"
    depends_on:
      - postgres-datasource
      - ms-fixtures
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPORTS_PULSE_DATASOURCE_URL_NOIFICATIONS: jdbc:postgresql://postgres-datasource:5432/${SPORTS_PULSE_DATASOURCE_DB_NOTIFICATIONS}
      SPORTS_PULSE_DATASOURCE_USERNAME: ${SPORTS_PULSE_DATASOURCE_USERNAME}
      SPORTS_PULSE_DATASOURCE_PASSWORD: ${SPORTS_PULSE_DATASOURCE_PASSWORD}
      SPORTS_PULSE_JPA_DDL: ${SPORTS_PULSE_JPA_DDL}
      SWAGGER_UI_DOCUMENTATION_ENABLED: ${SWAGGER_UI_DOCUMENTATION_ENABLED}
      FIXTURES_SERVICE_URL: http://ms-fixtures:8085
    restart: on-failure
    networks:
      - sports-pulse-network

  ms-dashboard:
    build:
      context: ./ms-dashboard
      dockerfile: Dockerfile
    ports:
      - "8089:8089"
    depends_on:
      - ms-fixtures
      - ms-standings
      - ms-leagues
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SWAGGER_UI_DOCUMENTATION_ENABLED: ${SWAGGER_UI_DOCUMENTATION_ENABLED}
      FIXTURES_SERVICE_URL: http://ms-fixtures:8085
      STANDINGS_SERVICE_URL: http://ms-standings:8086
      LEAGUES_SERVICE_URL: http://ms-leagues:8082
      SPORTS_PULSE_API_FOOTBALL_BASE_URL: ${SPORTS_PULSE_API_FOOTBALL_BASE_URL}
      SPORTS_PULSE_API_FOOTBALL_KEY: ${SPORTS_PULSE_API_FOOTBALL_KEY}
    restart: on-failure
    networks:
      - sports-pulse-network

networks:
  sports-pulse-network:
    driver: bridge