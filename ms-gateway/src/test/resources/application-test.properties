spring.application.name=sports-pulse-gateway
server.port=8080
logging.level.org.springframework=WARN
logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.com.sportspulse.gateway=DEBUG
logging.level.io.github.resilience4j=DEBUG

spring.data.redis.host=localhost
spring.data.redis.port=6379

# Cors Configuration
sportspulse.app.cors.allowed-methods=GET,POST,PUT,DELETE
sportspulse.app.cors.allowed-origins=http://localhost:3000
sportspulse.app.cors.max-age=3600

spring.cloud.gateway.server.webflux.httpclient.connect-timeout=1000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=3s

resilience4j.circuitbreaker.instances.ms-auth.sliding-window-size=10
resilience4j.circuitbreaker.instances.ms-auth.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.ms-auth.failure-rate-threshold=100
resilience4j.circuitbreaker.instances.ms-auth.wait-duration-in-open-state=1s
resilience4j.circuitbreaker.instances.ms-auth.permitted-number-of-calls-in-half-open-state=10
resilience4j.circuitbreaker.instances.ms-auth.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.timelimiter.instances.ms-auth.timeout-duration=5s