spring.application.name=sports-pulse-gateway
server.port=8080
logging.level.org.springframework=WARN
logging.level.root=INFO

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.cloud.gateway.server.webflux.httpclient.connect-timeout=3000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=5s

sportspulse.gateway.services.auth=http://localhost:8081
sportspulse.gateway.services.leagues=http://localhost:8082
sportspulse.gateway.services.teams=http://localhost:8083
sportspulse.gateway.services.fixtures=http://localhost:8085
sportspulse.gateway.services.standings=http://localhost:8086
sportspulse.gateway.services.notifications=http://localhost:8088
sportspulse.gateway.services.dashboard=http://localhost:8089