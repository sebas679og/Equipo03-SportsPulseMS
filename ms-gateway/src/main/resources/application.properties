# Application Configuration for Sports Pulse Gateway Service
spring.application.name=sports-pulse-gateway
server.port=8080
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
spring.config.import=optional:file:.env[.properties]
logging.level.org.springframework=${SPORTS_PULSE_LEVEL_LOGIN:WARN}
logging.level.root=${SPORTS_PULSE_LEVEL_LOGIN:INFO}
management.endpoints.web.exposure.include=health

# Redis Configuration
spring.data.redis.host=${SPORTS_PULSE_REDIS_HOST}
spring.data.redis.port=${SPORTS_PULSE_REDIS_PORT}

# Gateway Configuration
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=${SPORTS_PULSE_GATEWAY_CONNECT_TIMEOUT:3000}
spring.cloud.gateway.server.webflux.httpclient.response-timeout=${SPORTS_PULSE_GATEWAY_RESPONSE_TIMEOUT:5s}

# Downstream Service URLs
sportspulse.gateway.services.auth=${SPORTS_PULSE_AUTH_SERVICE_URL}
sportspulse.gateway.services.leagues=${SPORTS_PULSE_LEAGUES_SERVICE_URL}
sportspulse.gateway.services.teams=${SPORTS_PULSE_TEAMS_SERVICE_URL}
sportspulse.gateway.services.fixtures=${SPORTS_PULSE_FIXTURES_SERVICE_URL}
sportspulse.gateway.services.standings=${SPORTS_PULSE_STANDINGS_SERVICE_URL}
sportspulse.gateway.services.notifications=${SPORTS_PULSE_NOTIFICATIONS_SERVICE_URL}
sportspulse.gateway.services.dashboard=${SPORTS_PULSE_DASHBOARD_SERVICE_URL}

# Actuator Configuration

# Cors Configuration
sportspulse.app.cors.allowed-methods=${SPORTS_PULSE_GATEWAY_ALLOWED_METHODS}
sportspulse.app.cors.allowed-origins=${SPORTS_PULSE_GATEWAY_ALLOWED_ORIGINS}
sportspulse.app.cors.max-age=${SPORTS_PULSE_GATEWAY_MAX_AGE:3600}

# Documentation Configuration (Swagger/OpenAPI)
springdoc.api-docs.enabled=${SWAGGER_UI_DOCUMENTATION_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_UI_DOCUMENTATION_ENABLED:false}
springdoc.api-docs.version=OPENAPI_3_1
