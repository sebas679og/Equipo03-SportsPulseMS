name: Code Quality for Sports Pulse

on:
  pull_request:
  workflow_dispatch:

jobs:

  auth-service:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ms-auth

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Spotless — check format
        run: mvn spotless:check

      - name: Checkstyle — check style
        run: mvn checkstyle:check

      - name: PMD — check for code issues
        run: mvn pmd:check

