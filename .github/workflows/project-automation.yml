name: Project Board Automation

on:
  issues:
    types: [assigned]
  pull_request:
    types: [opened, closed]
    branches-ignore:
      - main
  push:
    branches-ignore:
      - main
      - dev

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  # ─── BACKLOG → READY ───────────────────────────────────────────────────────
  move-to-ready:
    name: Move to Ready on Assignment
    if: github.event_name == 'issues' && github.event.action == 'assigned'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const move = require('./.github/scripts/move-project-card.js');
            const issueNodeId = context.payload.issue.node_id;
            console.log(`Issue assigned: #${context.payload.issue.number}`);
            await move(github, issueNodeId, 'Ready');

  # ─── READY → IN PROGRESS ───────────────────────────────────────────────────
  move-to-in-progress:
    name: Move to In Progress on Branch Push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const move = require('./.github/scripts/move-project-card.js');

            const branchName = context.payload.ref.replace('refs/heads/', '');
            const commitMessages = context.payload.commits.map(c => c.message).join('\n');

            // Detects issue number in the branch name
            // Supports: 42-feature, feature/42-login, feature-42, fix/42, 42_something
            const branchMatch = branchName.match(/(?:^|[\/\-_])(\d+)(?:[\/\-_]|$)/);

            // Detects references in commit messages
            // Supports: closes #42, fixes #42, refs #42, #42
            const commitMatch = commitMessages.match(
              /(?:closes?|fixes?|resolves?|refs?)\s+#(\d+)|(?:^|\s)#(\d+)/im
            );

            const issueNumber = branchMatch?.[1]
              || commitMatch?.[1]
              || commitMatch?.[2];

            if (!issueNumber) {
              console.log('No issue number found in branch name or commits — skipping.');
              return;
            }

            console.log(`Found issue #${issueNumber} from push on branch "${branchName}"`);

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(issueNumber),
            });

            await move(github, issue.node_id, 'In progress');

  # ─── IN PROGRESS → IN REVIEW ───────────────────────────────────────────────
  move-to-in-review:
    name: Move to In Review on PR Open
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const move = require('./.github/scripts/move-project-card.js');
            const getLinkedIssues = require('./.github/scripts/get-linked-issues.js');

            const prNumber = context.payload.pull_request.number;
            const prBody   = context.payload.pull_request.body  || '';
            const prTitle  = context.payload.pull_request.title || '';
            const combined = `${prTitle}\n${prBody}`;

            // 1. Try to find the issue by text (closes #42, etc.)
            const textMatch =
              combined.match(/(?:closes?|fixes?|resolves?|refs?)\s+#(\d+)/i) ||
              combined.match(/#(\d+)/);

            let issueNodeIds = [];

            if (textMatch) {
              console.log(`Issue #${textMatch[1]} found in the PR text`);
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(textMatch[1]),
              });
              issueNodeIds = [issue.node_id];
            } else {
              // 2. Fallback: GraphQL query for the Development section link
              console.log('There is no reference in text, searching for Development link...');
              issueNodeIds = await getLinkedIssues(github, context, prNumber);
            }

            if (issueNodeIds.length === 0) {
              console.log('No linked issues found — skipping.');
              return;
            }

            for (const nodeId of issueNodeIds) {
              await move(github, nodeId, 'In review');
            }

  # ─── IN REVIEW → DONE ──────────────────────────────────────────────────────
  move-to-done:
    name: Move to Done on PR Merge
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const move = require('./.github/scripts/move-project-card.js');
            const getLinkedIssues = require('./.github/scripts/get-linked-issues.js');

            const prNumber = context.payload.pull_request.number;
            const prBody   = context.payload.pull_request.body  || '';
            const prTitle  = context.payload.pull_request.title || '';
            const combined = `${prTitle}\n${prBody}`;

            const textMatch =
              combined.match(/(?:closes?|fixes?|resolves?|refs?)\s+#(\d+)/i) ||
              combined.match(/#(\d+)/);

            let issueNodeIds = [];

            if (textMatch) {
              console.log(`Issue #${textMatch[1]} found in the PR text`);
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(textMatch[1]),
              });
              issueNodeIds = [issue.node_id];
            } else {
              console.log('There is no reference in text, searching for Development link...');
              issueNodeIds = await getLinkedIssues(github, context, prNumber);
            }

            if (issueNodeIds.length === 0) {
              console.log('No linked issues found — skipping.');
              return;
            }

            for (const nodeId of issueNodeIds) {
              await move(github, nodeId, 'Done');
            }