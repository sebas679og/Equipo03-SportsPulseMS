name: Run Tests for Sports Pulse

on:
  pull_request:
  workflow_dispatch:

jobs:
  auth-service:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ms-auth

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify Docker
        run: docker --version

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Run tests and generate coverage report
        run: mvn -B clean verify -Dspotless.check.skip=true -Dcheckstyle.skip=true -Dpmd.skip=true

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-customers
          path: ms-auth/target/site/jacoco/

