name: Docker Build & Push

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - name: sports-pulse-auth
            context: ms-auth
            description: Auth service handling user registration, authentication, and issuing JWT tokens required by all microservices for validating protected requests.
          - name: sports-pulse-dashboard
            context: ms-dashboard
            description: Dashboard service aggregating data from fixtures, standings, and leagues to deliver a unified league summary.
          - name: sports-pulse-fixtures
            context: ms-fixtures
            description: Fixtures service managing matches (upcoming, live, results), enriching data via teams service and serving notifications and dashboard.
          - name: sports-pulse-gateway
            context: ms-gateway
            description: Single entry gateway routing requests to microservices and enforcing global rate limiting to protect the system and ensure stability.
          - name: sports-pulse-leagues
            context: ms-leagues
            description: Leagues service providing football leagues, countries, and seasons data via API-Football with in-memory caching to reduce external requests.
          - name: sports-pulse-notifications
            context: ms-notifications
            description: Notifications service enabling users to subscribe to match events and delivering alerts via webhook or log channels.
          - name: sports-pulse-standings
            context: ms-standings
            description: Standings service providing up-to-date league tables, enriching each team with full details via the teams service.
          - name: sports-pulse-teams
            context: ms-teams
            description: Teams service managing team data (name, crest, country, stadium) and serving as a core dependency for fixtures, standings, and dashboard services.
      max-parallel: 1

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from pom.xml
        id: vars
        working-directory: ${{ matrix.service.context }}
        run: |
          chmod +x mvnw 2>/dev/null || true
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout 2>/dev/null)
          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not extract version from pom.xml"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Build & push ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.context }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:${{ steps.vars.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            BUILD_VERSION=${{ steps.vars.outputs.version }}
            IMAGE_DESCRIPTION=${{ matrix.service.description }}