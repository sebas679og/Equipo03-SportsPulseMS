spring.application.name=sports-pulse-auth
server.port=8081
logging.level.org.springframework=WARN
logging.level.root=INFO
spring.jpa.hibernate.ddl-auto=create-drop

# Jwt Configurations
app.jwt.secret=jwt_secret_key_for_testing_purposes_only
app.jwt.expiration=3600
app.jwt.token-type=Bearer

# Security Api Key internal
SPORTS_PULSE_INTERNAL_API_KEY=test_internal_api_key