# Application Configuration for Sports Pulse Fixtures Service
spring.application.name=sports-pulse-fixtures
server.port=8085
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
spring.config.import=optional:file:.env[.properties]
logging.level.org.springframework=${SPORTS_PULSE_LEVEL_LOGIN:WARN}
logging.level.root=${SPORTS_PULSE_LEVEL_LOGIN:INFO}
management.endpoints.web.exposure.include=health

# Documentation Configuration (Swagger/OpenAPI)
springdoc.api-docs.enabled=${SWAGGER_UI_DOCUMENTATION_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_UI_DOCUMENTATION_ENABLED:false}
springdoc.api-docs.version=OPENAPI_3_1

# ApiFootball API Configuration
sportspulse.fixtures.api.football.base-url=${SPORTS_PULSE_API_FOOTBALL_BASE_URL}
sportspulse.fixtures.api.football.api-key=${SPORTS_PULSE_API_FOOTBALL_KEY}
sportspulse.fixtures.api.football.connect-timeout-ms=${SPORTS_PULSE_API_FOOTBALL_CONNECT_TIMEOUT_MS:3000}
sportspulse.fixtures.api.football.read-timeout-ms=${SPORTS_PULSE_API_FOOTBALL_READ_TIMEOUT_MS:10000}
sportspulse.fixtures.api.football.write-timeout-ms=${SPORTS_PULSE_API_FOOTBALL_WRITE_TIMEOUT_MS:5000}
sportspulse.fixtures.api.football.memory-size=${SPORTS_PULSE_API_FOOTBALL_MEMORY_SIZE:10}

# Auth Service Configuration
sportspulse.fixtures.services.auth.base-url=${SPORTS_PULSE_AUTH_SERVICE_URL}
sportspulse.fixtures.services.auth.api-key=${SPORTS_PULSE_INTERNAL_API_KEY}
sportspulse.fixtures.services.auth.connect-timeout-ms=${SPORTS_PULSE_AUTH_CONNECT_TIMEOUT_MS:3000}
sportspulse.fixtures.services.auth.read-timeout-ms=${SPORTS_PULSE_AUTH_SERVICE_READ_TIMEOUT_MS:10000}
sportspulse.fixtures.services.auth.write-timeout-ms=${SPORTS_PULSE_AUTH_SERVICE_WRITE_TIMEOUT_MS:5000}
sportspulse.fixtures.services.auth.memory-size=${SPORTS_PULSE_AUTH_SERVICE_MEMORY_SIZE:10}

# Cache Configuration
sportspulse.fixtures.cache.enabled=${SPORTS_PULSE_CACHE_FIXTURES_ENABLED:true}
sportspulse.fixtures.cache.ttl-minutes=${SPORTS_PULSE_CACHE_FIXTURES_TTL_MINUTES:1440}
sportspulse.fixtures.cache.max-size=${SPORTS_PULSE_CACHE_FIXTURES_MAX_SIZE:1000}
