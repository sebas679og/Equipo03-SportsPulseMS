# Application Configuration for Sports Pulse Fixtures Service
spring.application.name=sports-pulse-fixtures
server.port=8085
logging.level.org.springframework=WARN
logging.level.root=WARN
logging.level.com.sportspulse=DEBUG
management.endpoints.web.exposure.include=health

# Documentation Configuration (Swagger/OpenAPI)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.version=OPENAPI_3_1

# ApiFootball API Configuration
sportspulse.fixtures.api.football.base-url=http://localhost:1311
sportspulse.fixtures.api.football.api-key=your_api_key_here
sportspulse.fixtures.api.football.connect-timeout-ms=3000
sportspulse.fixtures.api.football.read-timeout-ms=10000
sportspulse.fixtures.api.football.write-timeout-ms=5000
sportspulse.fixtures.api.football.memory-size=10

# Auth Service Configuration
sportspulse.fixtures.services.auth.base-url=http://localhost:8081
sportspulse.fixtures.services.auth.api-key=your_internal_api_key_here
sportspulse.fixtures.services.auth.connect-timeout-ms=3000
sportspulse.fixtures.services.auth.read-timeout-ms=10000
sportspulse.fixtures.services.auth.write-timeout-ms=5000
sportspulse.fixtures.services.auth.memory-size=10

# Cache Configuration
sportspulse.fixtures.cache.enabled=false
sportspulse.fixtures.cache.ttl-minutes=720
sportspulse.fixtures.cache.max-size=1000
