# Application Configuration for Sports Pulse Teams Service
spring.application.name=sports-pulse-teams
server.port=8083
logging.level.org.springframework=WARN
logging.level.root=WARN
logging.level.com.sportspulse=DEBUG
management.endpoints.web.exposure.include=health

# Documentation Configuration (Swagger/OpenAPI)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ApiFootball API Configuration
sportspulse.teams.api.football.base-url=http://localhost:1311
sportspulse.teams.api.football.api-key=your_api_key_here

# Auth Service Configuration
sportspulse.teams.services.auth.base-url=http://localhost:8081
sportspulse.teams.services.auth.api-key=your_internal_api_key_here

# Cache Configuration
sportspulse.teams.cache.enabled=false
sportspulse.teams.cache.ttl-minutes=60
sportspulse.teams.cache.max-size=1000
