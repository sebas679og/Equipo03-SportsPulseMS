# Application Configuration for Sports Pulse Teams Service
spring.application.name=sports-pulse-teams
server.port=8083
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
spring.config.import=optional:file:.env[.properties]
logging.level.org.springframework=${SPORTS_PULSE_LEVEL_LOGIN:WARN}
logging.level.root=${SPORTS_PULSE_LEVEL_LOGIN:INFO}
management.endpoints.web.exposure.include=health

# Documentation Configuration (Swagger/OpenAPI)
springdoc.api-docs.enabled=${SWAGGER_UI_DOCUMENTATION_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_UI_DOCUMENTATION_ENABLED:false}
springdoc.api-docs.version=OPENAPI_3_1

# ApiFootball API Configuration
sportspulse.teams.api.football.base-url=${SPORTS_PULSE_API_FOOTBALL_BASE_URL}
sportspulse.teams.api.football.api-key=${SPORTS_PULSE_API_FOOTBALL_KEY}

# Auth Service Configuration
sportspulse.teams.services.auth.base-url=${SPORTS_PULSE_AUTH_SERVICE_URL}
sportspulse.teams.services.auth.api-key=${SPORTS_PULSE_INTERNAL_API_KEY}

# Cache Configuration
sportspulse.teams.cache.enabled=${SPORTS_PULSE_CACHE_TEAMS_ENABLED:true}
sportspulse.teams.cache.ttl-minutes=${SPORTS_PULSE_CACHE_TEAMS_TTL_MINUTES:1440}  # Default to 24 hours
sportspulse.teams.cache.max-size=${SPORTS_PULSE_CACHE_TEAMS_MAX_SIZE:1000}
